<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDIC Part I – Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, calm, exact – a bedside tool used daily on a phone.
   IDEA: an ICU observation chart – dated rows, ruled grid, scores written in the margin.
   PICTURE: the day's lesson card with a big score dial; questions as chart rows you tick.
   COLOUR and TYPE: monitor teal ground, white chart paper, alarm-red accent; IBM Plex Sans + Condensed numerals.
   LAYOUT: one column ≤ 760px; sticky top bar; today first, weeks below; lesson = Read | Quiz tabs. */
:root{color-scheme:light dark;
--bg:light-dark(#eef3f2,#0d1716);--paper:light-dark(#fff,#13211f);--ink:light-dark(#10201e,#e3eeec);
--mute:light-dark(#5b6f6c,#93a8a4);--rule:light-dark(#d6e2e0,#24403c);--teal:light-dark(#0b5f58,#3fb3a6);
--tealbg:light-dark(#0b5f58,#0a2f2b);--red:light-dark(#c8352b,#ff7a6e);--ok:light-dark(#1d7a46,#5fd08f);
--okbg:light-dark(#e3f4ea,#12301f);--badbg:light-dark(#fbe7e5,#3a1714);--half:light-dark(#9a6a00,#f0c35a);--halfbg:light-dark(#fff4d6,#33280c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:5;background:var(--tealbg);color:#fff;padding:10px max(4vw,14px);display:flex;gap:12px;align-items:center}
.top b{font:700 18px/1 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.2px}
.top nav{margin-left:auto;display:flex;gap:6px}
.top button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:8px 12px;font:500 14px "IBM Plex Sans",system-ui,sans-serif;min-height:40px;cursor:pointer}
.top button[aria-current=true]{background:#ffffff22;border-color:#fff}
@media (max-width:440px){.top{gap:6px;padding-inline:10px}.top nav{gap:4px}.top button{padding:6px 7px;font-size:13px}.top b{font-size:16px}}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,14px) 80px}
h1{font:700 clamp(26px,5vw,36px)/1.1 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;margin:8px 0 4px;text-wrap:balance}
h2{font:600 20px/1.2 "IBM Plex Sans",system-ui,sans-serif;margin:24px 0 8px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px;margin:12px 0}
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border-left:6px solid var(--teal)}
.dial{width:96px;height:96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 15px "IBM Plex Sans",system-ui,sans-serif;min-height:44px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:disabled{opacity:.5}
.week{margin-top:18px}.week h3{font:600 15px "IBM Plex Sans",system-ui,sans-serif;margin:0 0 6px;color:var(--mute)}
.row{display:grid;grid-template-columns:5.2em minmax(0,1fr) 4.2em;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--rule);cursor:pointer;color:inherit;text-decoration:none}
.row:hover{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.row .d{font:600 13px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color:var(--mute)}
.row .s{text-align:right;font:700 15px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0;border-bottom:2px solid var(--rule)}
.tabs button{background:none;border:0;padding:10px 14px;font:600 15px "IBM Plex Sans",system-ui,sans-serif;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{color:var(--teal);border-color:var(--teal)}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.md blockquote{margin:12px 0;padding:8px 12px;border-left:4px solid var(--half);background:var(--halfbg);border-radius:6px}
.md a{color:var(--teal)}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:14px 0}
.q .h{font:700 13px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color:var(--mute);text-transform:none;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--rule);border-radius:10px;margin:6px 0;cursor:pointer}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
.opt.sel{border-color:var(--teal)}
.kst{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.tf{display:flex;gap:4px}
.tf button{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);font:700 15px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
.tf button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.good{border-color:var(--ok)!important;background:var(--okbg)}.bad{border-color:var(--red)!important;background:var(--badbg)}
.q.done-1{border-left:6px solid var(--ok)}.q.done-0{border-left:6px solid var(--red)}.q.done-h{border-left:6px solid var(--half)}
.expl{margin-top:10px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--teal) 8%,transparent);font-size:15px}
.mark{font:700 14px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;margin-left:6px}
textarea{width:100%;min-height:120px;font:16px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding:10px;border-radius:10px;border:1.5px solid var(--rule);background:transparent;color:inherit}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px max(4vw,14px);display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 calc(-1*max(4vw,14px))}
.big{font:700 34px/1 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px}
.meter{height:8px;border-radius:9px;background:var(--rule);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--teal)}
.note{font-size:13px;color:var(--mute)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(max-width:600px){.today{grid-template-columns:1fr}.dial{justify-self:start}.top b span{display:none}}
@media(prefers-reduced-motion:no-preference){.q{transition:border-color .2s}}
</style>
</head>
<body>
<header class="top"><b style="white-space:nowrap">EDIC I <span>· daily</span></b>
<nav><button id="nHome" aria-current="true">Plan</button><button id="nAca">Janek</button><button id="nMock">Mock</button><button id="nMis">Mistakes</button><button id="nProg">Scores</button></nav></header>
<main id="app"><p class="sub">Loading questions…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
{
const app=document.getElementById('app');
let BOOK={},bAns={},bDone=false,DATA=[],BY={},QK={},db=null,uid=null,sample=null,ATT={},SRS={},TIMER=null;
const DOMS=[["Cardiovascular",20],["Infection & sepsis",20],["Respiratory",15],["Neurology",15],["Renal & metabolic",10],["GI & liver",10],["Other",10]];
const CTX=/\b(question|Q)\s?\d+\b|same patient|previous (question|patient)|above patient/i;
const addDays=(d,n)=>{const t=new Date(d+'T12:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmi=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
const fmd=s=>(s||'').split(/\n{2,}/).map(b=>/^\s*[-*] /.test(b)?'<ul>'+b.split(/\n/).filter(l=>l.trim()).map(l=>'<li>'+fmi(l.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>':/^#{1,4} /.test(b)?'<h3>'+fmi(b.replace(/^#+ /,''))+'</h3>':'<p>'+fmi(b).replace(/\n/g,'<br>')+'</p>').join('');
const md=s=>{try{return marked.parse(s||'')}catch(e){return fmd(s)}};
const mdi=s=>{try{return marked.parseInline(s||'')}catch(e){return fmi(s)}};
const today=new Date().toISOString().slice(0,10);
const fmtD=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
const pct=(s,m)=>m?Math.round(100*s/m):0;
const linkFix=html=>html.replace(/href="(?:\.\.\/)*(?:lessons\/)?(?:(W\d\d)\/(D\d|review)|monthly\/(\d{4}-\d\d))\.md"/g,(m,w,f,mo)=>`href="#${mo?'M-'+mo:w+'-'+f}"`);

function score(q,ans){
  if(q.type==='A')return ans===q.answer?1:0;
  if(!Array.isArray(ans))return 0;
  const n=q.answer.length,c=q.answer.filter((v,i)=>ans[i]===v).length;
  return c===n?1:(n>=4&&c===n-1)?.5:0;
}
function label(x){return x.kind==='sim'?'Mock exam':x.kind==='mis'?'Mistakes':x.kind==='janek'?'Janek':x.id.startsWith('extra')?'Bonus':x.kind==='monthly'?'Monthly':x.kind==='review'?'Review':x.kind==='mock'?'Mock':x.id.split('-')[1]}

function home(){
  setNav('home');
  const next=DATA.find(x=>x.date>=today&&x.questions.length)||DATA.find(x=>!ATT[x.id])||DATA[0];
  const weeks={};DATA.filter(x=>!x.id.startsWith('bstyle')&&x.kind!=='janek').forEach(x=>{const w=x.kind==='monthly'?'Monthly reviews':x.id.startsWith('extra')?'Bonus workshops':'Week '+x.id.slice(1,3);(weeks[w]=weeks[w]||[]).push(x)});
  const a=ATT[next.id];
  app.innerHTML=`<h1>Next up</h1>
  <div class="card today"><div><div class="sub">${fmtD(next.date)} · ${label(next)}</div>
  <h2 style="margin:4px 0 10px">${esc(next.title.replace(/^W\d+ · \w+ – /,''))}</h2>
  <a class="btn" href="#${next.id}">${next.body?'Read & answer':'Start'}</a></div>${dial(a?a.pct:null)}</div>
  <p class="note">Scores are saved to your account and Claude can read them to update PROGRESS.md in your GitHub repo.</p>
  ${Object.entries(weeks).map(([w,xs])=>`<div class="week"><h3>${w}</h3>${xs.map(rowH).join('')}</div>`).join('')}`;
}
function rowH(x){const a=ATT[x.id];return `<a class="row" href="#${x.id}"><span class="d">${fmtD(x.date)||'—'}</span><span>${esc(x.title.replace(/^W\d+ · /,''))}</span><span class="s" style="color:${a?(a.pct>=70?'var(--ok)':a.pct>=60?'var(--half)':'var(--red)'):'var(--mute)'}">${a?a.pct+'%':x.questions.length+'Q'}</span></a>`}
function dial(p){const r=40,c=2*Math.PI*r,v=p==null?0:p/100;
  return `<svg class="dial" viewBox="0 0 96 96" role="img" aria-label="${p==null?'not attempted':p+' percent'}"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--rule)" stroke-width="9"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${p==null?'var(--rule)':p>=70?'var(--ok)':p>=60?'var(--half)':'var(--red)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-weight="700" font-size="20" fill="currentColor">${p==null?'–':p+'%'}</text></svg>`}

let cur=null,answers={},submitted=false,tab='quiz';
function lesson(id){
  const x=BY[id];if(!x){home();return}
  setNav('');cur=x;answers={};submitted=false;tab=x.body?'read':'quiz';
  const prev=ATT[id];
  if(prev&&prev.answers){answers=JSON.parse(JSON.stringify(prev.answers))}
  render();
}
function render(){
  const x=cur;
  app.innerHTML=`<p class="sub">${x.kind==='janek'?'<a href="#janek" style="color:var(--teal)">← Janek otázky</a>':'<a href="#" style="color:var(--teal)">← Plan</a>'}${x.date?' · '+fmtD(x.date):''} · ${label(x)}</p>
  <h1>${esc(x.title)}</h1>
  ${x.body?`<div class="tabs" role="tablist"><button role="tab" id="tR" aria-selected="${tab==='read'}">Read</button><button role="tab" id="tQ" aria-selected="${tab==='quiz'}">Questions (${x.questions.length}${x.open.length?' + '+x.open.length:''})</button>${BY['bstyle-'+x.id]?`<button role="tab" id="tS">Case-style (${BY['bstyle-'+x.id].questions.length})</button>`:''}${(BOOK[x.id]||[]).length?`<button role="tab" id="tB">📕 Benington (${BOOK[x.id].length})</button>`:''}</div>`:''}
  <div id="pane"></div>`;
  if(x.body){document.getElementById('tR').onclick=()=>{tab='read';render()};document.getElementById('tQ').onclick=()=>{tab='quiz';render()}
    const tb=document.getElementById('tB');if(tb)tb.onclick=()=>{location.hash='book-'+x.id};const ts=document.getElementById('tS');if(ts)ts.onclick=()=>{location.hash='bstyle-'+x.id}}
  const pane=document.getElementById('pane');
  if(tab==='read'){pane.innerHTML=`<div class="md">${linkFix(md(x.body))}</div><p><button class="btn" id="go">Go to questions →</button></p>`;
    document.getElementById('go').onclick=()=>{tab='quiz';render();scrollTo(0,0)};return}
  const summ=submitted?(()=>{const r=x.questions.map(q=>score(q,answers[q.n]));const c=r.filter(v=>v===1).length,h=r.filter(v=>v===.5).length,w=r.length-c-h;
    return `<div class="card" style="margin-bottom:14px"><b>Result: ${c} ✓ · ${h} ½ · ${w} ✗</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${x.questions.map((q,i)=>`<a href="javascript:void(0)" data-jump="q${q.n}" style="min-width:40px;text-align:center;padding:6px 8px;border-radius:8px;text-decoration:none;font-weight:700;color:#fff;background:${r[i]===1?'var(--ok)':r[i]===.5?'var(--half)':'var(--red)'}">${q.n}</a>`).join('')}</div><p class="note" style="margin:6px 0 0">Tap a number to jump to that question.</p></div>`})():'';
  pane.innerHTML=summ+x.questions.map(qH).join('')+(x.open.length?'<h2>Open-ended questions</h2>'+x.open.map(oH).join(''):'')+
   `<div class="bar"><span id="cnt" class="sub"></span>${x.kind==='sim'&&!submitted?'<span id="timer" class="big" aria-live="off"></span>':''}<span id="res" class="big"></span><button class="btn" id="sub">${submitted?'Retry':'Submit & score'}</button></div>`;
  bind();count();
  app.querySelectorAll('[data-jump]').forEach(a=>a.onclick=()=>{const el=document.getElementById(a.dataset.jump);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:'smooth'})});
  if(submitted)showRes();
  if(x.kind==='sim'&&!submitted)tick();
}
function qH(q,i){
  const a=answers[q.n];
  const res=submitted?score(q,a):null;
  const cls=submitted?(res===1?'done-1':res===.5?'done-h':'done-0'):'';
  let body='';
  if(q.type==='A'){body=q.options.map((o,j)=>{const L='ABCDEF'[j],sel=a===L;
    const st=submitted?(L===q.answer?'good':sel?'bad':''):'';
    const badge=submitted?(L===q.answer?`<span class="mark" style="color:var(--ok)"> ✓ correct answer${sel?' – your choice':''}</span>`:sel?`<span class="mark" style="color:var(--red)"> ✗ your choice</span>`:''):'';
    return `<label class="opt ${sel?'sel':''} ${st}"><input type="radio" name="q${q.n}" value="${L}" ${sel?'checked':''} ${submitted?'disabled':''}><span><b>${L}.</b> ${mdi(o)}${badge}</span></label>`}).join('')}
  else{body=q.options.map((o,j)=>{const v=a?a[j]:null,L='ABCDEF'[j];
    const st=submitted?(v===q.answer[j]?'good':'bad'):'';
    return `<div class="kst ${st}" style="${st?'padding-inline:8px;border-radius:8px':''}"><span><b>${L}.</b> ${mdi(o)}${submitted?`<br><span class="mark" style="color:${v===q.answer[j]?'var(--ok)':'var(--red)'}">${v===q.answer[j]?'✓':'✗'} you: ${v?(v==='T'?'True':'False'):'—'} · correct: ${q.answer[j]==='T'?'True':'False'}</span>`:''}</span><span class="tf">${['T','F'].map(t=>`<button data-q="${q.n}" data-j="${j}" data-v="${t}" aria-pressed="${v===t}" ${submitted?'disabled':''}>${t}</button>`).join('')}</span></div>`}).join('')}
  return `<div class="q ${cls}" id="q${q.n}"><div class="h">Q${q.n}${submitted?` · <span style="color:${res===1?'var(--ok)':res===.5?'var(--half)':'var(--red)'};font-weight:700">${res===1?'✓ correct (1 pt)':res===.5?`½ – ${q.answer.length-1} of ${q.answer.length} right (0.5 pt)`:'✗ wrong (0 pt)'}</span>`:''}</div>
  <div>${md(q.stem)}</div>${body}${submitted?`<div class="expl">${linkFix(md((q.type==='A'?'**'+q.answer+'.** ':'**'+q.answer.map((v,j)=>'ABCDEF'[j]+' – '+v).join(', ')+'.** ')+q.expl))}</div>`:''}</div>`;
}
function oH(o){const a=(answers['O'+o.n]||{});
  return `<div class="q" id="o${o.n}"><div class="h">Open question ${o.n}</div><div>${md(o.q)}</div>
  <textarea data-o="${o.n}" placeholder="Write your answer…">${esc(a.text||'')}</textarea>
  <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-grade="${o.n}" ${sample?'':'hidden'}>Mark with Claude</button><button class="btn ghost" data-model="${o.n}">Show model answer</button></p>
  <div id="og${o.n}">${a.fb?fbH(a):''}</div><div id="om${o.n}" hidden class="expl">${linkFix(md(o.model))}</div></div>`}
function fbH(a){return `<div class="expl"><b>Claude's mark: ${a.mark}/10.</b> ${mdi(a.fb)}${a.missing&&a.missing.length?'<br><b>Missing:</b> '+a.missing.map(mdi).join('; '):''}</div>`}
function bind(){
  app.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{answers[+r.name.slice(1)]=r.value;persistMock();r.closest('.q').querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.contains(r)));count()});
  app.querySelectorAll('.tf button').forEach(b=>b.onclick=()=>{const n=+b.dataset.q,j=+b.dataset.j;const arr=answers[n]||Array(cur.questions.find(z=>z.n===n).options.length).fill(null);arr[j]=b.dataset.v;answers[n]=arr;persistMock();
    b.parentNode.querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed',o===b));count()});
  app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const k='O'+t.dataset.o;answers[k]=Object.assign(answers[k]||{},{text:t.value})});
  app.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{const e=document.getElementById('om'+b.dataset.model);e.hidden=!e.hidden});
  app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>gradeOpen(+b.dataset.grade,b));
  document.getElementById('sub').onclick=()=>{if(submitted){answers={};submitted=false;render();scrollTo(0,0);return}submit()};
}
function count(){const x=cur,done=x.questions.filter(q=>{const a=answers[q.n];return q.type==='A'?!!a:Array.isArray(a)&&a.every(v=>v)}).length;
  const c=document.getElementById('cnt');if(c)c.textContent=`${done}/${x.questions.length} answered`}
function showRes(){const x=cur,s=x.questions.reduce((t,q)=>t+score(q,answers[q.n]),0);
  document.getElementById('res').textContent=`${s}/${x.questions.length} · ${pct(s,x.questions.length)}%`;return s}
async function submit(){
  if(TIMER){clearInterval(TIMER);TIMER=null}
  submitted=true;render();const x=cur,s=showRes(),max=x.questions.length;
  srsUpdate(x);
  if(x.kind==='mis'){return}
  if(x.kind==='sim')try{localStorage.removeItem('edic-mock')}catch(e){}
  const rec={id:x.id,title:x.title,kind:x.kind,score:s,max,pct:pct(s,max),date:new Date().toISOString(),answers,
    byType:{A:x.questions.filter(q=>q.type==='A').reduce((t,q)=>t+score(q,answers[q.n]),0),K:x.questions.filter(q=>q.type==='K').reduce((t,q)=>t+score(q,answers[q.n]),0)},

  app.innerHTML=`<h1>Janek otázky</h1><p class="sub">Extra questions from Janek, word for word, with the original feedback and references. ${xs.length} set${xs.length===1?'':'s'} · ${n} questions${done.length?` · ${done.length} done`:''}. As in the original, a Type A question may have 4 options and a K′ question a different number of statements.</p>
  ${xs.length?Object.entries(byD).map(([d,ys])=>`<div class="week"><h3>${esc(d)}</h3>${ys.map(rowH).join('')}</div>`).join(''):'<p class="note">No sets yet.</p>'}
  ${n>=10?`<p style="margin-top:16px"><button class="btn ghost" id="aMix">Shuffle all Janek questions (${n})</button></p>`:''}`;
  const b=document.getElementById('aMix');if(b)b.onclick=()=>{cur=virtualSet('janmix-'+Date.now(),'mis','Janek otázky – all shuffled',shuf(xs.flatMap(x=>x.questions)));answers={};submitted=false;tab='quiz';render();scrollTo(0,0)};
}
function setNav(w){[['nHome','home'],['nAca','aca'],['nProg','prog'],['nMock','mock'],['nMis','mis']].forEach(([i,k])=>document.getElementById(i).setAttribute('aria-current',w===k))}
function route(){if(TIMER){clearInterval(TIMER);TIMER=null}const h=location.hash.slice(1);if(h==='scores')progress();else if(h==='book'){bDone=false;bookHub()}else if(h.startsWith('book-')){if(bAns._id!==h.slice(5))bDone=false;bookSet(h.slice(5))}else if(h==='janek')janek();else if(h==='mock')mock();else if(h==='mistakes')mistakes();else if(h&&BY[h])lesson(h);else{home();const c=app.querySelector('.card.today');const n=Object.keys(BOOK).filter(k=>k!=='_weeks').reduce((t,k)=>t+BOOK[k].length,0);if(c&&n)c.insertAdjacentHTML('afterend',`<p style="margin:10px 0 0"><a class="btn ghost" href="#book" style="text-decoration:none;display:inline-block">📕 Benington book by topic (${n} Q) →</a></p>`)}scrollTo(0,0)}
document.getElementById('nHome').onclick=()=>{location.hash='';route()};
document.getElementById('nProg').onclick=()=>{location.hash='scores'};
document.getElementById('nAca').onclick=()=>{location.hash='janek'};
document.getElementById('nMock').onclick=()=>{location.hash='mock'};
document.getElementById('nMis').onclick=()=>{location.hash='mistakes'};
addEventListener('hashchange',route);

(async()=>{
  try{ATT=JSON.parse(localStorage.getItem('edic-att')||'{}')}catch(e){ATT={}}
  try{SRS=JSON.parse(localStorage.getItem('edic-srs')||'{}')}catch(e){SRS={}}
  try{DATA=await (await fetch('questions.json')).json()}catch(e){app.innerHTML='<p>Could not load questions.</p>';return}
  BOOK={}
  await loadJanek();
  DATA.forEach(x=>{BY[x.id]=x;x.questions.forEach(q=>{q.src=x.id;QK[q.key]=q})});seedSRS();misBadge();route();
  if(window.claude){
    claude.use('sample').then(s=>{sample=s;if(cur&&tab==='quiz')app.querySelectorAll('[data-grade]').forEach(b=>b.hidden=!s)}).catch(()=>{});
    const t=setTimeout(()=>{},10000);
    try{db=await claude.use('db');clearTimeout(t);
      if(db){const snap=await db.collection('attempts').get();(snap.docs||snap).forEach(d=>{const v=d.data?d.data():d;if(!v||!v.id)return;if(v.id==='_srs'){SRS=Object.assign({},v.items||{},SRS);return}ATT[v.id]=v});seedSRS();misBadge();
        if(!location.hash||location.hash==='#scores')route()}}catch(e){console.log('db unavailable',e)}
  }
})();
}
</script>
